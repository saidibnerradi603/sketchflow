# Netlify configuration for SketchFlow React Studio

[build]
  base = "src/sketchflow/ui"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://sketchflow-production-7d12.up.railway.app"

# Single-Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
